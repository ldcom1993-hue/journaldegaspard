name: Deploy website to OVH

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Les déploiements se suivent au lieu de se chevaucher. cancel-in-progress
# reste à false, et c'est le point important : annuler laisserait la
# production sur un commit intermédiaire. C'est exactement ce qui s'est
# produit le 6 août, deux fusions à 28 secondes d'écart n'ayant donné qu'un
# seul déploiement — sur le premier des deux commits.
concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          local-dir: ./
          server-dir: /www/

          dangerous-clean-slate: false

          exclude: |
            **/.git*
            **/.github*
            scripts/**
            docs/**
            README.md
            agents.md
            # État vivant des parties du duel : appartient au serveur,
            # un déploiement ne doit jamais y toucher.
            api/parties/**
