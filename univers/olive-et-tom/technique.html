<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fiche détaillée d'une technique d'Olive et Tom et des joueurs qui l'utilisent." />
    <title>Olive et Tom · Technique</title>
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/entites.css" />
  </head>
  <body>
    <header class="site-header universe-header">
      <div class="container">
        <a class="home-link" href="/" aria-label="Accueil">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M4.75 10.6 12 5.4l7.25 5.2M8.2 10.35V18.8h7.6v-8.45"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </a>
        <h1>Olive et Tom</h1>
        <p class="universe-subtitle">Technique</p>
      </div>
    </header>

    <main>
      <section class="entity-detail" aria-labelledby="entity-detail-title">
        <div class="container">
          <a class="back-link" href="/univers/olive-et-tom/techniques.html">← Retour aux techniques</a>
          <h2 id="entity-detail-title" class="visually-hidden">Détail de la technique</h2>

          <article id="entity-detail-shell" class="entity-detail-shell" aria-live="polite">
            <div class="entity-detail-loading">
              <p>Chargement de la technique…</p>
            </div>
          </article>
        </div>
      </section>
    </main>

    <script type="module">
      import { createEntityDetailPage } from "/assets/js/entites.js";

      createEntityDetailPage({
        source: "/assets/data/techniques.json",
        relationKey: "users",
        titlePrefix: "Olive et Tom ·",
        labels: {
          notFound: "Technique introuvable",
          notFoundHint: "La technique demandée n'existe pas ou n'est pas disponible.",
          section: "Utilisée par"
        },
        getSubtitle: (technique) => technique.japanese_name,
        getDescription: (technique) => technique.description,
        getFacts: (technique) => [
          { label: "Première apparition", value: technique.first_appearance }
        ]
      });
    </script>
  </body>
</html>
